<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="t d">
<title id="t">NLP research pipeline illustration</title>
<desc id="d">A research workflow showing social posts, preprocessing, BERT and transformer analysis, and visualized insights.</desc>
<defs>
