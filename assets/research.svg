    <stop offset="0" stop-color="#e9efff"/>
    <stop offset="1" stop-color="#f5d8d1"/>
  </linearGradient>
</defs>
<rect width="1000" height="680" rx="42" fill="url(#bg)"/>
<text x="60" y="78" font-family="Arial" font-size="28" font-weight="700" fill="#142238">Research workflow — millions of social posts</text>
<g font-family="Arial" fill="#142238">
